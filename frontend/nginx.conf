server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json
        application/javascript image/svg+xml font/woff2;

    # Long-lived cache for Vite's content-hashed assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api to the backend service on the compose network. Docker's
    # embedded DNS resolver + a variable upstream forces re-resolution so a
    # backend container recreated on redeploy doesn't leave nginx pinned to
    # a stale IP. Same-origin from the browser's point of view, which is
    # what makes the backend's SameSite=Lax; Path=/api auth cookie work
    # without any cross-site cookie handling — the backend never needs its
    # own public domain.
    # `hub-api-internal`, not `backend` — the backend container is also on
    # the shared dokploy-network (for the managed DB), where the plain
    # service name `backend` could collide with another Dokploy project's
    # backend. This alias exists only on the private hub_internal network.
    # See docker-compose.yml.
    resolver 127.0.0.11 valid=10s;
    location /api {
        set $upstream http://hub-api-internal:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        client_max_body_size 10m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # index.html itself must never be cached — it references the
    # content-hashed JS/CSS bundle above by name, so a stale cached copy
    # keeps serving a stale bundle after every redeploy (e.g. the old
    # password-based LoginPage instead of the current Authentik one) until
    # the cache expires or the user hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
