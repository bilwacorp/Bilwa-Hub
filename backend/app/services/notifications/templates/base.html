<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ company_name | default('BilwaCorp Fleet Hub') }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F6F8; font-family:'Inter', Arial, sans-serif; color:#1A1A1A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F6F8; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px; width:100%;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background-color:#16213E; border-radius:8px 8px 0 0; padding:24px 32px;" align="left">
              <span style="color:#F5F6F8; font-size:20px; font-weight:600;">{{ company_name | default('BilwaCorp Fleet Hub') }}</span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#FFFFFF; padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background-color:#FFFFFF; border-radius:0 0 8px 8px; padding:16px 32px 32px; border-top:1px solid #EEEEEE;">
              <p style="margin:0; font-size:12px; color:#888888; line-height:1.5;">
                &copy; {{ current_year }} {{ company_name | default('BilwaCorp Fleet Hub') }}. Automated fleet alert — do not reply.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
