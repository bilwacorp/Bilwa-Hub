{% extends "base.html" %}
{% block title %}Approval needed{% endblock %}
{% block content %}
<h1 style="margin:0 0 16px; font-size:20px; color:#16213E;">Approval needed</h1>
<p style="margin:0 0 16px; font-size:15px; line-height:1.6;">
  Hi {{ approver }}, the following request is waiting on your approval:
</p>
<p style="margin:0 0 16px; font-size:15px; font-weight:600;">{{ request }}</p>
{% if action_url %}
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:6px; background-color:#16213E;">
      <a href="{{ action_url }}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:600; color:#FFFFFF; text-decoration:none;">Review in Fleet Hub</a>
    </td>
  </tr>
</table>
{% endif %}
{% endblock %}
